plugins {
    id 'com.android.application'
}

android {
    namespace 'com.techbroz.budspop'
    compileSdk 34

    defaultConfig {
        applicationId 'com.techbroz.budspop'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // debug-signed on purpose: this is a sideload APK for one person, not a Play Store build
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
